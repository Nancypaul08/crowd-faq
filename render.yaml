# render.yaml — OpenClaw Crowd FAQ deployment blueprint
# Docs: https://render.com/docs/yaml

services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - name: openclaw-crowd-backend
    type: web
    plan: free
    region: singapore
    runtime: node
    rootDir: ./server
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # Set in Render dashboard: mongodb://localhost:27017/crowd_faq or Atlas URI
      - key: JWT_SECRET
        sync: false          # Set in Render dashboard: crowd_faq_super_secret_key_2026
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://openclaw-crowd-frontend.onrender.com
      - key: OPENAI_API_KEY
        sync: false          # Set your OpenAI API key in Render dashboard

    healthCheckPath: /api/health

  # ── Frontend (static) ────────────────────────────────────────────────────
  - name: openclaw-crowd-frontend
    type: web
    plan: free
    region: singapore
    runtime: static
    rootDir: ./client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    
    envVars:
      - key: VITE_API_URL
        value: https://openclaw-crowd-backend.onrender.com

# ── Notes ──────────────────────────────────────────────────────────────────
#
# 1. SIGN UP at https://render.com (free tier is sufficient to start)
#
# 2. MONGODB ATLAS SETUP:
#    - Create free cluster at https://cloud.mongodb.com
#    - Whitelist IP 0.0.0.0/0 (or Render's IP ranges)
#    - Copy connection string → set as MONGO_URI in Render dashboard
#
# 3. LLM PROVIDER (required — Render doesn't have GPU for Ollama):
#    Option A — OpenAI (easiest):
#      LLM_PROVIDER=openai, LLM_MODEL=gpt-4o-mini, LLM_API_KEY=sk-...
#    Option B — Anthropic:
#      LLM_PROVIDER=anthropic, LLM_MODEL=claude-3-haiku-20240307, LLM_API_KEY=sk-ant-...
#    The ollama.js service needs updating to call the chosen provider.
#
# 4. DEPLOY STEPS:
#    a. Push this render.yaml + project to GitHub
#    b. In Render dashboard → "New" → "Blueprint"
#    c. Connect GitHub repo, set env vars in the UI
#    d. Deploy both services together
#
# 5. CORS: Update server/index.js origin to your frontend URL after deploy
#
# 6. To avoid Ollama code changes, update server/services/ollama.js to
#    route to OpenAI/Anthropic when LLM_PROVIDER is not "ollama"